<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>제1회 디즈니스토어배 한글 받아치기 대회</title>
<meta property="og:title" content="제1회 디즈니스토어배 한글 받아치기 대회">
<meta property="og:description" content="30초 동안 디즈니 캐릭터 이름을 몇 개나 칠 수 있을까요?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ===== 색상 (여기 값만 바꾸면 전체 톤이 바뀝니다) ===== */
  :root {
    --navy: #17123f;        /* 디즈니스토어 키 컬러 */
    --navy-light: #2b2277;
    --navy-deep: #0e0a2b;
    --card: #ffffff; --ink: #17123f; --sub: #6c6a8a; --line: #e7e6f2;
    --gold: #ffd66b; --pink: #ff7fae; --no: #e4003a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink); min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(120% 70% at 50% 0%, var(--navy-light) 0%, var(--navy) 55%, var(--navy-deep) 100%) fixed;
    display: flex; justify-content: center; padding: 20px 16px;
  }
  button, input { font-family: inherit; }
/* 제목·단어·버튼·숫자는 동글동글한 '동글체', 작은 설명 글씨는 또렷한 '고운돋움' (둘 다 개인 디자이너의 무료 공개 서체) */
  h1, .word, .big, .count, .btn, .eyebrow, .hud, .grade, .rank, .top3 h2, .top3 li b, .me b {
    font-family: 'Dongle', 'Gowun Dodum', sans-serif; font-weight: 700; line-height: 1;
  }
  .wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
  .screen { display: none; }
  .screen.on { display: block; animation: rise .35s ease-out; }
  #game.on { animation: none; }
  .card { background: var(--card); border-radius: 28px; padding: 24px 18px; margin-bottom: 14px; text-align: center;
          box-shadow: 0 0 36px rgba(132, 120, 255, .28); }
  .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; color: var(--navy); background: var(--gold);
             padding: 5px 12px; border-radius: 999px; letter-spacing: .5px; }
  h1 { font-size: 34px; margin: 10px 0 8px; line-height: 1.2; }
  .lead { color: var(--sub); font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
  input[type=text] {
    width: 100%; font-size: 18px; padding: 14px; border: 2px solid var(--line);
    border-radius: 16px; text-align: center; outline: none; color: var(--ink); background: #fff;
  }
  input[type=text]:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(43, 34, 119, .12); }
  .btn {
    position: relative; overflow: hidden;
    width: 100%; font-size: 18px; font-weight: 700; padding: 16px; margin-top: 12px;
    border: 0; border-radius: 16px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--navy-light), var(--navy));
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .btn.shine::after {      /* 버튼 위를 지나가는 빛 */
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    animation: sweep 2.6s ease-in-out infinite;
  }
  .link { background: none; border: 0; color: var(--sub); font-size: 13px; text-decoration: underline; margin-top: 12px; cursor: pointer; }
  .msg { color: var(--no); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .me { font-size: 15px; margin-bottom: 4px; }
  .me b { font-size: 18px; }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; font-weight: 700; }

  .top3 h2 { font-size: 15px; margin: 0 0 10px; color: var(--navy); }
  .top3 ol { list-style: none; margin: 0; padding: 0; }
  .top3 li { display: flex; justify-content: space-between; padding: 10px 6px; font-size: 16px; border-top: 1px solid var(--line); }
  .top3 li:first-child { border-top: 0; }
  .top3 .empty { color: var(--sub); font-size: 14px; justify-content: center; }

  /* 게임 화면 (키보드가 올라와도 보이도록 위쪽에 모아둠) */
  .hud { display: flex; justify-content: space-between; color: #fff; font-weight: 700; font-size: 18px; margin-bottom: 8px; }
  .bar { height: 10px; background: rgba(255,255,255,.18); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 5px;
           background: linear-gradient(90deg, var(--pink), var(--gold)); box-shadow: 0 0 10px rgba(255, 214, 107, .8); }
  .board { padding: 18px; transition: background .15s; }
  .board.good { background: #e3fbe9; }
  .board.bad { background: #ffe3ea; animation: shake .25s; }
  .word { font-size: 46px;
          min-height: 58px; line-height: 58px; margin-bottom: 12px; white-space: nowrap; }
  .word.long { font-size: 34px; }
  .word.pop { animation: pop .22s ease-out; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .row .btn { width: auto; margin: 0; padding: 0 20px; }
  .hint { color: rgba(255,255,255,.75); font-size: 13px; text-align: center; }
  .count { position: fixed; inset: 0; background: var(--navy); color: var(--gold);   /* 남색 단색 배경 */
           font-size: 120px; font-weight: 700;
           display: none; align-items: flex-start; justify-content: center; padding-top: 18vh; z-index: 9;
           text-shadow: 0 0 30px rgba(255, 214, 107, .7); }
  .count.on { display: flex; }
  .count span { display: inline-block; }
  .count span.tick { animation: pop .35s ease-out; }   /* 숫자만 튀어오름 (배경은 고정) */

  /* 결과 화면 */
  .big { font-size: 25px; font-weight: 700; margin: 4px 0 8px; }
  .acc { font-size: 17px; color: var(--sub); }
  .grade { display: inline-block; margin: 12px 0; padding: 8px 16px; border-radius: 999px; background: var(--gold); color: var(--navy); font-weight: 700; }
  .rank { font-size: 28px; font-weight: 700; margin: 6px 0 2px; }
  .ranksub { font-size: 13px; color: var(--sub); min-height: 16px; }
  .codebox { margin: 14px 0 6px; padding: 12px; border: 2px dashed var(--line); border-radius: 16px; }
  .codebox .code { font-size: 26px; }
  .codebox small { display: block; color: var(--sub); margin-top: 4px; font-size: 12px; }
  .prize { font-size: 14px; line-height: 1.6; margin-top: 10px; }

  /* 동글체는 글자가 작게 그려져서 크기를 키워 맞춤 */
  h1 { font-size: 60px; margin: 8px 0 4px; }
  .eyebrow { font-size: 25px; padding: 6px 14px 3px; }
  .btn { font-size: 36px; padding: 10px 16px 6px; }
  .row .btn { padding: 4px 20px 0; }
  .hud { font-size: 30px; }
  .word { font-size: 64px; line-height: 60px; min-height: 60px; padding-top: 6px; }
  .word.long { font-size: 50px; }
  .big { font-size: 42px; }
  .grade { font-size: 26px; padding: 8px 18px 4px; }
  .rank { font-size: 46px; }
  .top3 h2 { font-size: 28px; margin-bottom: 6px; }
  .top3 li { align-items: center; }
  .top3 li b { font-size: 28px; }
  .me b { font-size: 30px; }
  .count { font-size: 190px; }

  /* ===== 반짝이 효과 ===== */
  #sky, #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #sky { z-index: 0; }
  #fx { z-index: 20; }
  .star { position: absolute; color: #fff; opacity: .15; animation: twinkle 3s ease-in-out infinite; }
  .star.gold { color: var(--gold); }
  .spark { position: absolute; color: var(--gold); font-size: 18px; animation: fly .7s ease-out forwards; }
  .spark.pink { color: var(--pink); }
  .fall { position: absolute; top: -30px; color: var(--gold); animation: fall 2.6s linear forwards; }
  .fall.pink { color: var(--pink); }
  .fall.white { color: #fff; }

  @keyframes twinkle { 0%, 100% { opacity: .12; transform: scale(.7); } 50% { opacity: .95; transform: scale(1.15); } }
  @keyframes fly { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
                   100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(140deg); opacity: 0; } }
  @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(300deg); opacity: .2; } }
  @keyframes pop { 0% { transform: scale(.7); opacity: .3; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .star, .btn.shine::after, .screen.on, .word.pop, .count span.tick, .board.bad { animation: none; }
    .star { opacity: .5; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<div class="wrap">

  <!-- ① 첫 화면 -->
  <section id="home" class="screen on">
    <div class="card">
      <div class="eyebrow">제1회 디즈니스토어배</div>
      <h1>한글 받아치기 대회</h1>
      <p class="lead">화면에 뜨는 캐릭터 이름을 그대로 받아치세요.<br>30초 동안 몇 개나 칠 수 있을까요?</p>

      <div id="newPlayer">
        <input type="text" id="nick" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off">
        <input type="text" id="oldCode" maxlength="6" placeholder="참여코드 6자리" autocomplete="off"
               autocapitalize="characters" style="display:none;margin-top:8px">
      </div>
      <div id="oldPlayer" style="display:none">
        <div class="me"><b id="meNick"></b> 님</div>
        <div class="me">참여코드 <span class="code" id="meCode"></span></div>
      </div>

      <button class="btn shine" id="startBtn">게임 시작</button>
      <div class="msg" id="homeMsg"></div>
      <button class="link" id="resetBtn" style="display:none">다른 닉네임으로 참여하기</button>
    </div>
    <div class="card top3">
      <h2>실시간 TOP 3</h2>
      <ol class="top3list"><li class="empty">불러오는 중…</li></ol>
    </div>
  </section>

  <!-- ② 게임 화면 -->
  <section id="game" class="screen">
    <div class="hud"><span>⏱ <span id="time">30.0</span>초</span><span>✅ <span id="score">0</span>개</span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card board" id="board">
      <div class="word" id="word"></div>
      <form class="row" id="form" autocomplete="off">
        <input type="text" id="answer" placeholder="여기에 입력" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" enterkeyhint="done">
        <button class="btn" id="submitBtn" type="submit">입력</button>
      </form>
    </div>
    <div class="hint">다 쳤으면 엔터(완료) 또는 [입력] 버튼!</div>
  </section>

  <!-- ③ 결과 화면 -->
  <section id="result" class="screen">
    <div class="card">
      <div class="big" id="resScore"></div>
      <div class="acc" id="resAcc"></div>
      <div class="grade" id="resGrade"></div>
      <div class="rank" id="resRank">순위 계산 중…</div>
      <div class="ranksub" id="resRankSub"></div>
      <div class="codebox">
        참여코드: <span class="code" id="resCode"></span>
        <small>당첨 확인을 위해 참여코드를 기억해주세요.</small>
      </div>
      <p class="prize">이벤트 종료 후 최종 1~3위에게<br>디즈니스토어의 선물을 드립니다 🎁</p>
      <button class="btn" id="saveRetryBtn" style="display:none;background:#1b2340">기록 다시 저장하기</button>
      <button class="btn shine" id="againBtn">다시 도전하기</button>
      <div class="msg" id="resMsg"></div>
    </div>
    <div class="card top3">
      <h2>실시간 TOP 3</h2>
      <ol class="top3list"><li class="empty">불러오는 중…</li></ol>
    </div>
  </section>
</div>

<div class="count" id="count"><span id="countNum">3</span></div>
<div id="fx"></div>

<script>
  /* ▼▼▼ 여기 한 곳만 고치면 됩니다 ▼▼▼
     Apps Script 배포 후 받은 웹 앱 URL(끝이 /exec)을 작은따옴표 안에 붙여넣으세요. */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwPbO7A34223I53LHJtbJXPqgxJkfvgFz8GE95xbbqGhWANEI3UkW4Fva3IDFMG6ZPI/exec';
  /* ▲▲▲ 여기까지 ▲▲▲ */

  /* ===== 게임 설정 (원하면 바꿀 수 있는 부분) ===== */
  var DURATION = 30;   // 제한시간(초). Code.gs의 GAME_DURATION과 같게

  // 따라 칠 단어 목록. '이름', 형식으로 자유롭게 넣고 빼세요. (띄어쓰기는 채점에서 무시됩니다)
  var WORDS = [
    // 미키와 친구들
    '미키', '미니', '도날드', '데이지', '구피', '플루토', '칩', '데일',
    // 곰돌이 푸 · 릴로 & 스티치
    '푸', '티거', '피글렛', '이요르', '스티치', '릴로',
    // 토이 스토리
    '우디', '버즈', '제시', '렉스', '포키', '랏소',
    // 겨울왕국 · 라이온 킹
    '엘사', '안나', '올라프', '스벤', '크리스토프', '심바', '날라', '티몬', '품바',
    // 디즈니 클래식 · 프린세스
    '알라딘', '자스민', '지니', '라푼젤', '모아나', '마우이', '신데렐라', '백설공주', '에리얼', '벨', '뮬란', '오로라', '피터팬', '팅커벨', '덤보', '밤비', '피노키오', '앨리스',
    // 픽사 · 주토피아
    '니모', '도리', '설리', '마이크', '주디', '닉', '베이맥스', '미구엘', '레미', '맥퀸', '잭잭',
    // 인사이드 아웃
    '기쁨이', '슬픔이', '버럭이', '까칠이', '소심이', '불안이', '빙봉',
    // 마블
    '아이언맨', '스파이더맨', '토르', '헐크', '로키', '그루트', '로켓', '타노스', '블랙팬서', '닥터스트레인지', '캡틴아메리카', '블랙위도우', '호크아이', '앤트맨', '데드풀', '완다', '비전', '스타로드', '가모라', '울버린'
  ];

  var GRADES = [       // 결과 등급 (점수 이상이면 해당 등급)
    { min: 16, label: '✨ 전설의 디즈니 타자왕' },
    { min: 11, label: '🏰 디즈니 찐팬' },
    { min: 6,  label: '🎀 디즈니 입문자' },
    { min: 0,  label: '🌱 새싹 손가락' }
  ];
  /* ========================================== */

  var player = null;
  var st = { score: 0, attempts: 0, word: '', token: null, endAt: 0, timer: null, playing: false, counted: false, failed: false };
  var $ = function (id) { return document.getElementById(id); };

  /* ----- 서버(구글 시트) 통신 ----- */
  function callServer(action, args, ok, fail) {
    var ctrl = window.AbortController ? new AbortController() : null;   // 20초 넘게 응답이 없으면 포기
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
    fetch(API_URL, {
      signal: ctrl ? ctrl.signal : undefined,
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, args: args })
    })
      .then(function (r) { if (!r.ok) throw new Error('서버 응답 ' + r.status); return r.json(); })
      .then(function (res) { clearTimeout(timer); if (res && res.__error) fail(new Error(res.__error)); else ok(res); })
      .catch(function (err) { clearTimeout(timer); fail(err && err.name === 'AbortError' ? new Error('응답 시간 초과') : err); });
  }
  function server() {
    var ok = function () {}, fail = function () {};
    var run = {
      withSuccessHandler: function (f) { ok = f; return run; },
      withFailureHandler: function (f) { fail = f; return run; }
    };
    ['getTop3', 'registerPlayer', 'startGame', 'saveResult'].forEach(function (name) {
      run[name] = function () { callServer(name, Array.prototype.slice.call(arguments), ok, fail); };
    });
    return run;
  }

  /* ----- 반짝이 효과 ----- */
  var MARKS = ['✦', '✧', '✦', '⋆'];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function makeSky() {                       // 배경에서 깜빡이는 별
    var sky = $('sky');
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('span');
      s.className = 'star' + (i % 3 === 0 ? ' gold' : '');
      s.textContent = MARKS[i % MARKS.length];
      s.style.left = rnd(0, 100) + '%'; s.style.top = rnd(0, 100) + '%';
      s.style.fontSize = rnd(8, 20) + 'px';
      s.style.animationDuration = rnd(2, 5) + 's'; s.style.animationDelay = rnd(0, 4) + 's';
      sky.appendChild(s);
    }
  }
  function burst(el, n) {                    // 요소 주변으로 반짝이가 터짐
    var r = el.getBoundingClientRect(), fx = $('fx');
    for (var i = 0; i < n; i++) {
      (function () {
        var s = document.createElement('span'), ang = rnd(0, Math.PI * 2), dist = rnd(50, 120);
        s.className = 'spark' + (i % 3 === 0 ? ' pink' : '');
        s.textContent = MARKS[i % MARKS.length];
        s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
        s.style.fontSize = rnd(14, 26) + 'px';
        s.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        fx.appendChild(s);
        setTimeout(function () { s.remove(); }, 750);
      })();
    }
  }
  function starShower() {                    // 결과 화면에서 별이 쏟아짐
    var fx = $('fx'), kinds = ['', ' pink', ' white'];
    for (var i = 0; i < 36; i++) {
      (function (i) {
        var s = document.createElement('span');
        s.className = 'fall' + kinds[i % 3];
        s.textContent = MARKS[i % MARKS.length];
        s.style.left = rnd(0, 100) + '%'; s.style.fontSize = rnd(14, 30) + 'px';
        s.style.animationDuration = rnd(1.8, 3.2) + 's'; s.style.animationDelay = rnd(0, 1.2) + 's';
        fx.appendChild(s);
        setTimeout(function () { s.remove(); }, 4600);
      })(i);
    }
  }
  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  function show(id) {
    ['home', 'game', 'result'].forEach(function (s) { $(s).classList.toggle('on', s === id); });
    window.scrollTo(0, 0);
  }

  /* ----- 참여자 정보 (같은 기기에서는 닉네임·코드 유지) ----- */
  function loadPlayer() {
    try {
      var p = JSON.parse(localStorage.getItem('disneyTypingPlayer') || 'null');
      if (p && p.nickname && p.code) player = p;
    } catch (e) {}
  }
  function savePlayer() { try { localStorage.setItem('disneyTypingPlayer', JSON.stringify(player)); } catch (e) {} }
  function clearPlayer() { player = null; try { localStorage.removeItem('disneyTypingPlayer'); } catch (e) {} }

  function renderHome() {
    $('newPlayer').style.display = player ? 'none' : 'block';
    $('oldPlayer').style.display = player ? 'block' : 'none';
    $('resetBtn').style.display = player ? 'inline-block' : 'none';
    if (player) { $('meNick').textContent = player.nickname; $('meCode').textContent = player.code; }
  }

  /* ----- TOP 3 ----- */
  function renderTop3(list) {
    var medals = ['🥇', '🥈', '🥉'];
    var lists = document.querySelectorAll('.top3list');
    for (var k = 0; k < lists.length; k++) {
      var ol = lists[k];
      ol.innerHTML = '';
      if (!list || !list.length) {
        var e = document.createElement('li');
        e.className = 'empty';
        e.textContent = '아직 기록이 없어요. 첫 번째 주인공이 되어보세요!';
        ol.appendChild(e);
        continue;
      }
      list.forEach(function (r, i) {
        var li = document.createElement('li');
        var a = document.createElement('span'); a.textContent = medals[i] + ' ' + r.nickname;
        var b = document.createElement('b'); b.textContent = r.score + '개';
        li.appendChild(a); li.appendChild(b);
        ol.appendChild(li);
      });
    }
  }
  function loadTop3() {
    server().withSuccessHandler(renderTop3).withFailureHandler(function () { renderTop3([]); }).getTop3();
  }

  /* ----- 시작 ----- */
  function onStartClick() {
    $('homeMsg').textContent = '';
    if (player) { begin(); return; }
    var nick = $('nick').value.trim();
    if (!nick) { $('homeMsg').textContent = '닉네임을 입력해주세요.'; return; }
    var btn = $('startBtn');
    btn.disabled = true;
    server()
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.ok) {
          $('homeMsg').textContent = res.message;
          if (res.taken) $('oldCode').style.display = 'block';
          return;
        }
        $('oldCode').style.display = 'none'; $('oldCode').value = '';
        player = { nickname: res.nickname, code: res.code };
        savePlayer(); renderHome();
        begin();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        $('homeMsg').textContent = '연결이 불안정해요. 다시 시도해주세요. (' + (err && err.message ? err.message : '연결 오류') + ')';
      })
      .registerPlayer(nick, $('oldCode').value);
  }

  /* 서버에 "게임 시작"을 알림. 게임은 응답을 기다리지 않고 바로 시작하고, 응답은 저장할 때만 필요 */
  function requestToken(gameNo, tries) {
    st.tokenState = 'pending';
    server()
      .withSuccessHandler(function (token) {
        if (gameNo !== st.gameNo) return;
        st.token = token; st.tokenAt = Date.now(); st.tokenState = 'ok';
      })
      .withFailureHandler(function (err) {
        if (gameNo !== st.gameNo) return;
        st.tokenErr = err && err.message ? err.message : '연결 오류';
        if (tries > 1) setTimeout(function () { requestToken(gameNo, tries - 1); }, 1500);
        else st.tokenState = 'fail';
      })
      .startGame();
  }

  /* 버튼을 누른 순간 입력칸에 커서를 줘야 휴대폰 키보드가 올라옵니다 */
  function begin() {
    st.gameNo = (st.gameNo || 0) + 1;
    st.score = 0; st.attempts = 0; st.word = ''; st.token = null; st.tokenAt = 0; st.playing = false;
    $('score').textContent = '0'; $('time').textContent = DURATION.toFixed(1); $('barFill').style.width = '100%';
    $('word').textContent = ''; $('answer').value = '';
    show('game');
    try { $('answer').focus({ preventScroll: true }); } catch (e) { $('answer').focus(); }
    window.scrollTo(0, 0);
    requestToken(st.gameNo, 3);

    var n = 3, c = $('count'), num = $('countNum');
    num.textContent = n; c.classList.add('on'); replay(num, 'tick');
    var t = setInterval(function () {
      n--;
      if (n > 0) { num.textContent = n; replay(num, 'tick'); return; }
      clearInterval(t);
      c.classList.remove('on');
      st.playing = true;
      nextWord();
      $('answer').focus();
      st.endAt = Date.now() + DURATION * 1000;
      st.timer = setInterval(tick, 100);
    }, 1000);
  }

  /* ----- 게임 진행 ----- */
  function tick() {
    var left = Math.max(0, st.endAt - Date.now());
    $('time').textContent = (left / 1000).toFixed(1);
    $('barFill').style.width = (left / (DURATION * 10)) + '%';
    if (left <= 0) finish();
  }

  function nextWord() {
    // 전체 단어를 섞어서 한 바퀴 다 돌 때까지 같은 단어가 다시 나오지 않음
    if (!st.bag || !st.bag.length) {
      st.bag = WORDS.slice();
      for (var i = st.bag.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = st.bag[i]; st.bag[i] = st.bag[j]; st.bag[j] = t;
      }
      if (st.bag.length > 1 && st.bag[st.bag.length - 1] === st.word) st.bag.unshift(st.bag.pop());
    }
    var w = st.bag.pop();
    st.word = w;
    $('word').textContent = w;
    $('word').classList.toggle('long', w.length >= 6);
    replay($('word'), 'pop');
    $('answer').value = '';
  }

  function clean(s) { return String(s).normalize('NFC').replace(/\s+/g, '').toLowerCase(); }

  function submitAnswer(e) {
    e.preventDefault();
    if (!st.playing) return;
    var typed = clean($('answer').value);
    if (!typed) return;                      // 빈 칸은 제출로 치지 않음
    st.attempts++;
    var correct = typed === clean(st.word);
    if (correct) { st.score++; $('score').textContent = st.score; burst($('word'), 9); }
    var board = $('board');
    board.classList.remove('good', 'bad');
    board.classList.add(correct ? 'good' : 'bad');
    setTimeout(function () { board.classList.remove('good', 'bad'); }, 200);
    nextWord();
    $('answer').focus();
  }

  /* ----- 종료 & 저장 ----- */
  function finish() {
    if (!st.playing) return;
    st.playing = false;
    clearInterval(st.timer);
    $('answer').blur();

    var acc = st.attempts ? Math.round(st.score / st.attempts * 100) : 0;
    var grade = GRADES[GRADES.length - 1].label;
    for (var i = 0; i < GRADES.length; i++) { if (st.score >= GRADES[i].min) { grade = GRADES[i].label; break; } }

    $('resScore').textContent = DURATION + '초 동안 ' + st.score + '개 성공!';
    $('resAcc').textContent = '정확도 ' + acc + '%';
    $('resGrade').textContent = grade;
    $('resCode').textContent = player.code;
    show('result');
    starShower();
    save();
  }

  function save(isAuto) {
    $('resRank').textContent = '순위 계산 중…';
    $('resRankSub').textContent = '';
    $('resMsg').textContent = '';
    $('saveRetryBtn').style.display = 'none';
    $('againBtn').disabled = true;
    if (!isAuto) st.saveStart = Date.now();
    var fail = function (message, canRetry) {
      $('againBtn').disabled = false;
      $('resRank').textContent = '순위 확인 불가';
      $('resMsg').textContent = message;
      $('saveRetryBtn').style.display = canRetry ? 'block' : 'none';
    };
    // 서버의 "게임 시작" 응답이 아직 안 왔으면 잠깐 기다림
    if (!st.token) {
      if (Date.now() - st.saveStart > 20000) {
        fail('서버에 연결하지 못했어요. 다시 저장해주세요. (' + (st.tokenErr || '응답 없음') + ')', true);
        return;
      }
      if (st.tokenState === 'fail') requestToken(st.gameNo, 2);
      setTimeout(function () { save(isAuto || 'wait'); }, 500);
      return;
    }
    // 응답이 늦게 왔다면, 서버가 "너무 빨리 끝난 기록"으로 오해하지 않도록 조금 기다렸다가 저장
    var early = st.tokenAt + (DURATION - 2.5) * 1000 - Date.now();
    if (early > 0) { setTimeout(function () { save(isAuto || 'wait'); }, early); return; }

    server()
      .withSuccessHandler(function (res) {
        if (!res.ok) { fail(res.message, !!res.retry); return; }
        $('againBtn').disabled = false;
        $('resRank').textContent = '🏆 현재 ' + res.rank + '위';
        burst($('resRank'), 12);
        $('resRankSub').textContent = res.bestScore > st.score
          ? '내 최고 기록 ' + res.bestScore + '개 기준 · 전체 ' + res.total + '명'
          : '전체 ' + res.total + '명 중';
        renderTop3(res.top3);
      })
      .withFailureHandler(function (err) {
        if (isAuto !== 'retry') { setTimeout(function () { save('retry'); }, 1200); return; }   // 한 번은 자동으로 재시도
        fail('저장에 실패했어요. 다시 저장해주세요. (' + (err && err.message ? err.message : '연결 오류') + ')', true);
      })
      .saveResult({ nickname: player.nickname, code: player.code, score: st.score, attempts: st.attempts, token: st.token });
  }

  /* ----- 버튼 연결 ----- */
  $('startBtn').addEventListener('click', onStartClick);
  $('againBtn').addEventListener('click', begin);
  $('saveRetryBtn').addEventListener('click', function () { save(); });
  $('resetBtn').addEventListener('click', function () { clearPlayer(); renderHome(); $('homeMsg').textContent = ''; });
  $('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) onStartClick(); });
  $('form').addEventListener('submit', submitAnswer);
  $('answer').addEventListener('paste', function (e) { e.preventDefault(); });
  // [입력] 버튼을 눌러도 키보드가 내려가지 않게
  $('submitBtn').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('submitBtn').addEventListener('touchend', function (e) { e.preventDefault(); submitAnswer(e); });

  makeSky();
  loadPlayer();
  renderHome();
  if (API_URL.indexOf('https://script.google.com/') !== 0) {
    $('startBtn').disabled = true;
    $('homeMsg').textContent = '설정 필요: index.html 안의 API_URL에 웹 앱 URL(/exec)을 넣어주세요.';
    renderTop3([]);
  } else {
    loadTop3();
  }
</script>
</body>
</html>
